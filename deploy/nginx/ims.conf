# nginx server block for SQ-Way IMS on a VPS that already hosts other services.
# Copy to /etc/nginx/sites-available/ims and run:
#
#   sudo ln -s /etc/nginx/sites-available/ims /etc/nginx/sites-enabled/ims
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ims.srv1998322.hstgr.cloud
#
# IMS runs on port 3005 because port 3000 is taken by KaAyos.

server {
    listen 80;
    listen [::]:80;
    server_name ims.srv1998322.hstgr.cloud;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ims.srv1998322.hstgr.cloud;

    ssl_certificate     /etc/letsencrypt/live/ims.srv1998322.hstgr.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ims.srv1998322.hstgr.cloud/privkey.pem;

    # keep-alive + security headers for the session cookie (Secure flag set by Next.js in prod)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location /_next/static {
        alias /opt/IMS-Thrifted---Branded-Clothing/.next/static;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
